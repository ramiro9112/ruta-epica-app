<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta Épica — Confirmando cuenta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0B2F5C;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { opacity: 0.8; line-height: 1.6; margin-bottom: 16px; }
    .status { font-size: 14px; opacity: 0.6; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: #00BFA5;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    .error { color: #FF6B6B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✈️</div>
    <h1>Ruta Épica</h1>
    <p id="msg">Confirmando tu cuenta...</p>
    <p class="status" id="status"></p>
    <div id="action"></div>
  </div>

  <script>
    const APP_SCHEME = 'rutaepica://login-callback/';

    function redirect() {
      const url = new URL(window.location.href);
      const search = url.search;   // ?code=xxx  or  ?token_hash=xxx&type=signup
      const hash   = url.hash;     // #access_token=xxx&refresh_token=xxx

      // Error from Supabase (e.g. expired OTP)
      const errorCode = url.searchParams.get('error_code');
      const errorDesc = url.searchParams.get('error_description');
      if (errorCode) {
        document.getElementById('msg').textContent = 'El enlace expiró o no es válido.';
        document.getElementById('msg').classList.add('error');
        document.getElementById('status').textContent =
          errorCode === 'otp_expired'
            ? 'El enlace de confirmación venció. Regístrate de nuevo en la app.'
            : decodeURIComponent(errorDesc || errorCode);
        document.getElementById('action').innerHTML =
          '<p style="margin-top:16px;opacity:0.7;font-size:13px;">Vuelve a la app y regístrate con el mismo correo.</p>';
        return;
      }

      // Build deep link preserving all params
      const deepLink = APP_SCHEME + (search || '') + (hash || '');

      document.getElementById('msg').textContent = '¡Cuenta confirmada!';
      document.getElementById('status').textContent = 'Abriendo Ruta Épica...';

      // Try to open the app
      window.location.href = deepLink;

      // Fallback: if app doesn't open after 2s, show instructions
      setTimeout(() => {
        document.getElementById('status').textContent =
          'Si la app no abre, asegúrate de tener Ruta Épica instalada.';
        document.getElementById('action').innerHTML =
          '<p style="margin-top:16px;opacity:0.7;font-size:13px;">Abre la app manualmente e inicia sesión con tu correo.</p>';
      }, 2000);
    }

    redirect();
  </script>
</body>
</html>
