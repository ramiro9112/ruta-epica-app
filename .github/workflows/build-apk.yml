name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruta-epica-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Create Release with APK
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Ruta Épica v1.0 - Build ${{ github.run_number }}"
          body: |
            ## APK Debug — Ruta Épica

            Descarga el APK e instálalo en tu Android:
            1. Descarga `app-debug.apk`
            2. En Android: Ajustes → Seguridad → Instalar apps desconocidas ✓
            3. Instala el APK

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-debug.apk
          draft: false
          prerelease: false
