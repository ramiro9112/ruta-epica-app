name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build split APKs (per ABI)
        run: flutter build apk --debug --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-debug.apk ruta-epica-arm32-debug.apk   || true
          mv app-arm64-v8a-debug.apk   ruta-epica-arm64-debug.apk   || true
          mv app-x86_64-debug.apk      ruta-epica-x86_64-debug.apk  || true
          ls -lh *.apk

      - name: Upload arm64 APK (Android 2017+ — recomendado)
        uses: actions/upload-artifact@v4
        with:
          name: ruta-epica-arm64-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/ruta-epica-arm64-debug.apk
          retention-days: 30

      - name: Upload arm32 APK (Android antiguo)
        uses: actions/upload-artifact@v4
        with:
          name: ruta-epica-arm32-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/ruta-epica-arm32-debug.apk
          retention-days: 30

      - name: Create GitHub Release with all APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Ruta Épica — Build ${{ github.run_number }}"
          body: |
            ## APKs disponibles

            | APK | Dispositivo | Tamaño |
            |-----|-------------|--------|
            | `ruta-epica-arm64-debug.apk` | Android moderno (2017+, 64-bit) | ~20MB |
            | `ruta-epica-arm32-debug.apk` | Android antiguo (32-bit) | ~15MB |

            ### ¿Cuál descargar?
            - **La mayoría de teléfonos (2017 en adelante):** descarga `arm64`
            - **Teléfonos viejos (antes de 2017):** descarga `arm32`
            - Si no sabes cuál, descarga `arm64` primero

            ### Instalar
            1. Descarga el APK
            2. Android → Ajustes → Seguridad → Instalar apps desconocidas ✓
            3. Abre el APK descargado

            **Build:** ${{ github.run_number }} | **Commit:** `${{ github.sha }}`
          files: |
            build/app/outputs/flutter-apk/ruta-epica-arm64-debug.apk
            build/app/outputs/flutter-apk/ruta-epica-arm32-debug.apk
          draft: false
          prerelease: false

      - name: Deploy confirmation page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
